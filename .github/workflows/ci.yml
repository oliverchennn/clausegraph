name: ClauseGraph checks
on: [push, pull_request]
jobs:
  ownership:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check ownership using the base branch policy
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TASK_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if git cat-file -e "$BASE_SHA:.github/ownership.json" 2>/dev/null; then
            git show "$BASE_SHA:scripts/check_workflow.py" > "$RUNNER_TEMP/check_workflow.py"
            python "$RUNNER_TEMP/check_workflow.py" --base "$BASE_SHA" --head "$HEAD_SHA" --branch "$TASK_BRANCH" --require-current
          else
            echo 'Initial governance bootstrap: base has no policy; review this PR before trusting its policy.'
            python scripts/check_workflow.py --base "$BASE_SHA" --head "$HEAD_SHA" --branch "$TASK_BRANCH" --policy-file .github/ownership.json --require-current
          fi
  clean-install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: clausegraph_test
          POSTGRES_USER: clausegraph
          POSTGRES_PASSWORD: test-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U clausegraph -d clausegraph_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CLAUSEGRAPH_MODE: offline
      PYTHONPATH: backend
      POSTGRES_TEST_URL: postgresql+psycopg://clausegraph:test-only@localhost:5432/clausegraph_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements.txt -c backend/requirements.lock
      - run: npm ci
        working-directory: frontend
      - run: python -m ruff check backend scripts
      - run: python -m pytest backend/tests -q
      - run: python scripts/export_openapi.py
      - run: npm run generate:types
        working-directory: frontend
      - run: git diff --exit-code docs/openapi.json frontend/src/lib/api-types.ts
      - run: npm run typecheck && npm run lint && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: frontend/test-results
