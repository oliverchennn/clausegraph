name: clausegraph
x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  env_file:
    - path: .env
      required: false
  environment:
    ENVIRONMENT: development
    DATABASE_URL: postgresql+psycopg://clausegraph:${POSTGRES_PASSWORD:-clausegraph-local-only}@db:5432/clausegraph
    LOCAL_STORAGE_PATH: /app/.data/documents
  volumes:
    - originals:/app/.data
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: clausegraph
      POSTGRES_USER: clausegraph
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clausegraph-local-only}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clausegraph -d clausegraph"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    <<: *backend
    command: ["python", "scripts/migrate.py"]
    depends_on:
      db:
        condition: service_healthy
  api:
    <<: *backend
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
  worker:
    <<: *backend
    command: ["python", "-m", "clausegraph.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        API_INTERNAL_URL: http://api:8000
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres:
  originals:
